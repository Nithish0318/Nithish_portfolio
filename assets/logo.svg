<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Radial Gradient -->
    <radialGradient id="badge-bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#151d2a" />
      <stop offset="60%" stop-color="#0b0f17" />
      <stop offset="100%" stop-color="#040609" />
    </radialGradient>

    <!-- Neon Ring & Accent Gradients -->
    <linearGradient id="neon-cyan-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="45%" stop-color="#38ef7d" />
      <stop offset="70%" stop-color="#8a2be2" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="cyan-glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="purple-glow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Metal Bevel Gradient -->
    <linearGradient id="metal-frame" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Honeycomb Pattern -->
    <pattern id="hex-pattern" width="8" height="13.856" patternUnits="userSpaceOnUse">
      <path d="M 4 0 L 8 2.309 L 8 6.928 L 4 9.237 L 0 6.928 L 0 2.309 Z M 0 13.856 L 4 11.547 L 8 13.856" fill="none" stroke="rgba(0, 242, 254, 0.08)" stroke-width="0.5" />
    </pattern>

    <!-- Neon Intense Glow Filter -->
    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur1" />
      <feGaussianBlur stdDeviation="1" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Tech Bevel Rim -->
  <circle cx="50" cy="50" r="47" fill="url(#metal-frame)" stroke="#475569" stroke-width="1" />
  
  <!-- Outer Notch Accents (Top, Bottom, Left, Right) -->
  <path d="M 40 4 H 60 L 57 8 H 43 Z" fill="#0f172a" stroke="#00f2fe" stroke-width="0.8" />
  <path d="M 40 96 H 60 L 57 92 H 43 Z" fill="#0f172a" stroke="#a855f7" stroke-width="0.8" />
  <path d="M 4 40 V 60 L 8 57 V 43 Z" fill="#0f172a" stroke="#00f2fe" stroke-width="0.8" />
  <path d="M 96 40 V 60 L 92 57 V 43 Z" fill="#0f172a" stroke="#a855f7" stroke-width="0.8" />

  <!-- Outer Neon Glowing Ring -->
  <circle cx="50" cy="50" r="42" fill="none" stroke="url(#neon-cyan-purple)" stroke-width="2" filter="url(#badge-glow)" />

  <!-- Secondary Inner Glowing Ring -->
  <circle cx="50" cy="50" r="37.5" fill="none" stroke="url(#cyan-glow-grad)" stroke-width="1.2" opacity="0.9" />

  <!-- Inner Dark Disc Base -->
  <circle cx="50" cy="50" r="35.5" fill="url(#badge-bg)" stroke="#1e293b" stroke-width="1" />

  <!-- Honeycomb Grid Overlay -->
  <circle cx="50" cy="50" r="35" fill="url(#hex-pattern)" />

  <!-- Glass Arc Top Highlight -->
  <path d="M 18 36 A 34 34 0 0 1 82 36 A 35.5 35.5 0 0 0 18 36 Z" fill="white" opacity="0.06" />

  <!-- Stylized NK Monogram Emblem (Exact Match to logo_badge.jpg) -->
  <g filter="url(#badge-glow)">
    <!-- N Outer Bevel Box -->
    <path d="M 23 30 H 32 L 43 53 V 30 H 49 V 70 H 40 L 29 47 V 70 H 23 Z" fill="#0b0f17" stroke="url(#cyan-glow-grad)" stroke-width="1.8" stroke-linejoin="round" />
    <!-- N Inner Neon Core Line -->
    <path d="M 26 33 V 67 M 26 33 L 46 67 M 46 67 V 33" fill="none" stroke="#00f2fe" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- K Outer Bevel Box -->
    <path d="M 51 30 H 57 V 46 L 68 30 H 76 L 64 48 L 77 70 H 69 L 57 51 V 70 H 51 Z" fill="#0b0f17" stroke="url(#purple-glow-grad)" stroke-width="1.8" stroke-linejoin="round" />
    <!-- K Inner Neon Core Line -->
    <path d="M 54 33 V 67 M 54 49 L 72 33 M 54 49 L 72 67" fill="none" stroke="url(#purple-glow-grad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Core Intersection Dots -->
    <circle cx="26" cy="33" r="1.5" fill="#00f2fe" />
    <circle cx="46" cy="67" r="1.5" fill="#00f2fe" />
    <circle cx="72" cy="33" r="1.5" fill="#ec4899" />
    <circle cx="72" cy="67" r="1.5" fill="#a855f7" />
  </g>
</svg>
